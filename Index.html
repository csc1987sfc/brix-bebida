<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control Brix - Todo en Uno</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#e00020">
    <style>
        :root { --bg: #e9ecef; --text: #333; --primary: #e00020; --card: #fff; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin-bottom: 20px; }
        h2 { text-align: center; margin-top: 0; color: var(--primary); font-size: 1.4em; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        h2.blue-title { color: #1565c0; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.9em; color: #555; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; background-color: #fafafa; }
        input:focus, select:focus { outline: none; border-color: var(--primary); background-color: #fff; }
        .result-box { text-align: center; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 5px; border: 1px solid #e9ecef; }
        .main-value { font-size: 2.2em; font-weight: bold; transition: color 0.3s; }
        .color-red { color: #e00020; }
        .color-blue { color: #1565c0; }
        .sub-text { font-size: 0.9em; color: #666; margin-top: 5px; }
        .deviation { font-weight: bold; margin-top: 5px; }
        .good { color: #2e7d32; }
        .bad { color: #c62828; }
        .note { font-size: 0.8em; color: #888; font-style: italic; margin-top: 10px; }
    </style>
</head>
<body>

<!-- BLOQUE 1: CALCULADORA NORMAL -->
<div class="container">
    <h2 id="title-normal">1. Calculadora Normal</h2>
    
    <label for="producto">Producto en línea:</label>
    <select id="producto" onchange="updateUINormal()">
        <option value="coca-cola" data-target="10.37" data-color="#e00020">Coca-Cola (Obj: 10,37)</option>
        <option value="fanta-naranja" data-target="4.5" data-color="#f57c00">Fanta Naranja (Obj: 4,5)</option>
        <option value="fanta-limon" data-target="4.8" data-color="#fbc02d">Fanta Limón (Obj: 4,8)</option>
    </select>

    <label for="brixJarabeNorm">Brix del Jarabe:</label>
    <input type="text" id="brixJarabeNorm" inputmode="decimal" placeholder="Ej: 54,85" oninput="calcularNormal()">

    <label for="densidadNorm">Densidad Jarabe (kg/L):</label>
    <input type="text" id="densidadNorm" inputmode="decimal" value="1,26" oninput="calcularNormal()">

    <label for="ratioNorm">Ratio (L agua / L jarabe):</label>
    <input type="text" id="ratioNorm" inputmode="decimal" value="5,4" oninput="calcularNormal()">

    <div class="result-box">
        <div style="font-size: 1em; margin-bottom: 5px;">Brix en Bebida:</div>
        <div class="main-value color-red" id="resultadoNorm">0,00</div>
        <div class="sub-text" id="objetivoNorm">Objetivo: 10,37</div>
        <div class="deviation" id="desviacionNorm">Diferencia: 0,00</div>
    </div>
</div>

<!-- BLOQUE 2: CORRECCIÓN DE TANQUE -->
<div class="container">
    <h2 class="blue-title">2. Corrección 2º Llenado</h2>
    
    <label for="brixJarabeCorr">Brix del Jarabe (Entrada):</label>
    <input type="text" id="brixJarabeCorr" inputmode="decimal" placeholder="Ej: 54,87" oninput="calcularCorreccion()">

    <label for="densidadCorr">Densidad Jarabe (kg/L):</label>
    <input type="text" id="densidadCorr" inputmode="decimal" value="1,26" oninput="calcularCorreccion()">

    <label for="brixActualCorr">Brix 1ª Mezcla (Tanque):</label>
    <input type="text" id="brixActualCorr" inputmode="decimal" placeholder="Ej: 10,22" oninput="calcularCorreccion()">

    <label for="brixObjetivoCorr">Brix Objetivo Final:</label>
    <input type="text" id="brixObjetivoCorr" inputmode="decimal" value="10,37" oninput="calcularCorreccion()">

    <div class="result-box">
        <div class="sub-text" id="brixSegundoCorr">Brix para compensar: 0,00</div>
        <div style="font-weight: bold; margin-bottom: 5px; margin-top: 10px;">Nuevo Ratio de Agua:</div>
        <div class="main-value color-blue" id="resultadoRatioCorr">0,00</div>
        <div class="note">* Asume volúmenes iguales (Ej: 800L + 800L).</div>
    </div>
</div>

<script>
    // Función global para leer números con coma
    function parseInput(val) {
        if (!val) return 0;
        return parseFloat(val.replace(',', '.'));
    }

    // --- LÓGICA CALCULADORA NORMAL ---
    function updateUINormal() {
        const select = document.getElementById('producto');
        const option = select.options[select.selectedIndex];
        const color = option.getAttribute('data-color');
        
        document.getElementById('title-normal').style.color = color;
        document.getElementById('resultadoNorm').style.color = color;
        
        if (select.value === 'coca-cola') {
            document.getElementById('densidadNorm').value = '1,26';
        } else {
            document.getElementById('densidadNorm').value = '1,10'; 
        }
        calcularNormal();
    }

    function calcularNormal() {
        const brixJarabe = parseInput(document.getElementById('brixJarabeNorm').value);
        const densidad = parseInput(document.getElementById('densidadNorm').value);
        const ratio = parseInput(document.getElementById('ratioNorm').value);
        
        const select = document.getElementById('producto');
        const target = parseFloat(select.options[select.selectedIndex].getAttribute('data-target'));

        if (brixJarabe > 0 && densidad > 0 && ratio > 0) {
            const brixFinal = ((densidad * (brixJarabe / 100)) / (densidad + ratio)) * 100;
            const diferencia = brixFinal - target;

            document.getElementById('resultadoNorm').innerText = brixFinal.toFixed(2).replace('.', ',');
            document.getElementById('objetivoNorm').innerText = 'Objetivo: ' + target.toFixed(2).replace('.', ',');
            
            const devElement = document.getElementById('desviacionNorm');
            const difTexto = (diferencia > 0 ? '+' : '') + diferencia.toFixed(2).replace('.', ',');
            devElement.innerText = 'Diferencia: ' + difTexto;
            
            if (Math.abs(diferencia) <= 0.05) {
                devElement.className = 'deviation good';
            } else {
                devElement.className = 'deviation bad';
            }
        } else {
            document.getElementById('resultadoNorm').innerText = '0,00';
            document.getElementById('desviacionNorm').innerText = 'Diferencia: 0,00';
        }
    }

    // --- LÓGICA CORRECCIÓN TANQUE ---
    function calcularCorreccion() {
        const brixJarabe = parseInput(document.getElementById('brixJarabeCorr').value);
        const densidad = parseInput(document.getElementById('densidadCorr').value);
        const brixActual = parseInput(document.getElementById('brixActualCorr').value);
        const brixObjetivo = parseInput(document.getElementById('brixObjetivoCorr').value);

        if (brixJarabe > 0 && densidad > 0 && brixActual > 0 && brixObjetivo > 0) {
            const brixSegundoLlenado = brixObjetivo + (brixObjetivo - brixActual);
            const nuevoRatio = ((densidad * brixJarabe) / brixSegundoLlenado) - densidad;

            document.getElementById('brixSegundoCorr').innerText = 'Brix para compensar: ' + brixSegundoLlenado.toFixed(2).replace('.', ',');
            document.getElementById('resultadoRatioCorr').innerText = nuevoRatio.toFixed(2).replace('.', ',');
        } else {
            document.getElementById('brixSegundoCorr').innerText = 'Brix para compensar: 0,00';
            document.getElementById('resultadoRatioCorr').innerText = '0,00';
        }
    }

    // Inicializar al cargar la página
    updateUINormal();
</script>

</body>
</html>
